name: APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar archivos del juego
        run: |
          python build/make_precache.py
          npm install
          node build/copy-web.js

      - name: Crear el proyecto Android con Capacitor
        run: |
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Compilar el APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bastion-bravo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Bastión Bravo (APK)
          body: APK de prueba generado automáticamente. Descárgalo en el móvil e instálalo (permite "orígenes desconocidos").
          prerelease: false
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
