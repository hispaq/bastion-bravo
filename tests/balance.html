<!doctype html><html><head><meta charset="utf-8"><title>balance</title></head><body>
<script src="../sprites/manifest.js"></script>
<script src="../js/core/util.js"></script><script src="../js/core/assets.js"></script>
<script src="../js/data/balance.js"></script><script src="../js/core/save.js"></script>
<script src="../js/data/zones.js"></script><script src="../js/data/enemies.js"></script>
<script src="../js/data/bosses.js"></script><script src="../js/data/heroes.js"></script>
<script src="../js/data/upgrades.js"></script><script src="../js/data/levels.js"></script>
<script src="../js/data/rewards.js"></script><script src="../js/core/fx.js"></script>
<script src="../js/core/battle.js"></script>
<script>
// Jugador "tÃ­pico": hÃ©roes al nivel recomendado, huecos y castillo mejorados con el avance
const q = new URLSearchParams(location.search);
const mul = +(q.get('m') || 1);
const ids = ['arquera','mago_fuego','maga_hielo','ballestero','hechicera_rayo','ingeniero','sacerdote','halconera','druida','mosquetera'];
const out = [];
const levels = (q.get('l') || '1,3,8,10,15,20,25,30,40,45,50,60,65,70,75,80,85,90,95,100').split(',').map(Number);
for (const L of levels) {
  const def = BB.levelDef(L);
  const nh = Math.min(10, 3 + Math.floor((L - 1) / 11));
  const lvl = Math.max(1, Math.round((def.recommended || L) * mul));
  const up = Math.round(L * 0.45 * mul);
  const r = BB.test.simulate(L, { heroes: ids.slice(0, nh), heroLevel: lvl, slots: nh - 3,
    castle: { torreon: up, muralla: up, ballesta: Math.round(up / 2), reparacion: Math.round(up / 4) }, seconds: 400 });
  out.push(L + (def.boss ? 'J' : '') + ':' + (r.error ? 'ERR ' + r.error.slice(0, 120) : (r.victory ? 'W' : 'L') + ' hp' + r.castleHpFrac + ' t' + r.t + ' left' + r.enemiesLeft));
}
document.title = out.join(' | '); document.body.innerHTML = '<pre style="font:18px monospace;margin:8px">' + out.join('<br>') + '</pre>';
</script></body></html>
